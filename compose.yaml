services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradeprism
      POSTGRES_DB: tradeprism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeprism"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tradeprism:${POSTGRES_PASSWORD}@db:5432/tradeprism
      DATA_DIR: /data
    volumes:
      - research:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: ./backend
    command: ["python", "-m", "tradeprism.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tradeprism:${POSTGRES_PASSWORD}@db:5432/tradeprism
      DATA_DIR: /data
    volumes:
      - research:/data
    depends_on:
      api:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
  research:
